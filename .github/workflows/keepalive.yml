name: Keep-alive Supabase

# Supabase Free pausa el proyecto tras ~1 semana sin actividad. Esto lo "toca" cada 3 días.
# Secrets del repo: SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a rpc/ping
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
